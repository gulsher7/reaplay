[package]
name = "reaplay"
version = "0.1.0"
description = "An experimental macOS launcher for Windows games on Apple Silicon"
authors = ["ReaPlay contributors"]
license = ""
repository = "https://github.com/gulsher7/reaplay"
edition = "2024"
rust-version = "1.90"

[lib]
name = "reaplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
