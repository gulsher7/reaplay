# ReaPlay ownership map. One rule per line:  <owner>:<git pathspec>
#
# RULE: no path may match both owners. Overlap means merge conflicts, which
# defeats the whole point. Boundaries stay at directory granularity.
#
# The split follows the architecture boundary in docs/ARCHITECTURE.md: the
# Rust application layer and the React UI meet only at the Tauri command
# surface, which is frozen in docs/IPC_CONTRACT.md and owned by neither.

# --- ChatGPT: Rust application layer ---
chatgpt:src-tauri/**

# --- Claude Code: React UI ---
claude:src/**
claude:index.html

# --- Shared: read-only context for both, edited only by agreement ---
shared:docs/IPC_CONTRACT.md
shared:docs/ARCHITECTURE.md
shared:docs/ROADMAP.md
shared:README.md
shared:package.json
shared:tsconfig.json
shared:vite.config.ts
