# ReaPlay ownership map. One rule per line:  <owner>:<git pathspec>
#
# STATUS: Claude-only as of 2026-10-22, by the repository owner's decision.
# Claude Code owns the whole tree; there is no second agent editing it.
#
# The two-agent tooling in this directory still works if the split is resumed.
# To hand the Rust layer back to a browser-based agent, move `src-tauri/**`
# from the `claude` block to a `chatgpt` block and run:
#
#     ./collab/bundle.sh chatgpt
#
# The boundary that made the split viable is the Tauri command surface in
# docs/IPC_CONTRACT.md, which is still the only place the UI and the Rust
# layer meet.

claude:src/**
claude:src-tauri/**
claude:index.html
claude:docs/**
claude:collab/**

shared:README.md
shared:package.json
shared:tsconfig.json
shared:tsconfig.app.json
shared:vite.config.ts
